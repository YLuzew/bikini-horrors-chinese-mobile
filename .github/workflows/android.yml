name: Android Build
on: workflow_dispatch
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore key.keystore \
            -alias psychport \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass psychengine \
            -keypass psychengine \
            -dname "CN=Bikini Horrors, OU=Mobile, O=Ajwwk, L=Unknown, ST=Unknown, C=CN"

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c
      - name: Restore Previous Cache
        uses: actions/cache@v4
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
            export\release\windows\haxe\
            export\release\windows\obj\
            .haxelib\
          restore-keys: |
            cache-build-android
      - name: Clear stale mobile-controls
        run: |
          haxelib remove mobile-controls || true
          rm -rf .haxelib/mobile-controls || true
          rm -rf ~/haxelib/mobile-controls || true
          rm -rf ~/.haxelib/mobile-controls || true

      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git
      - name: List mobile-controls library files
        run: |
          LIB=$(find .haxelib -type d -name "mobile-controls" | head -1)
          echo "mobile-controls 库目录: $LIB"
          if [ -n "$LIB" ]; then
            echo "=== 库中的 .hx 文件 ==="
            find "$LIB" -name "*.hx" | sort || true
          fi

      - name: Debug environment
        run: |
          echo "=== 环境变量 ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== lime 配置 ==="
          haxelib run lime config || true
          echo "=== 已安装的库 ==="
          haxelib list || true
          echo "=== java 版本 ==="
          java -version 2>&1 || echo "找不到 java"
          echo "=== 磁盘空间 ==="
          df -h /
          echo "=== 目录体积 ==="
          du -sh . 2>/dev/null || true
          du -sh .haxelib 2>/dev/null || true
          du -sh export 2>/dev/null || true

      - name: Reset Gradle cache and free disk space
        run: |
          echo "=== 磁盘空间（清理前）==="
          df -h /

          echo ""
          echo "=== 清理预装的大体积软件包，腾出磁盘空间 ==="
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true

          echo ""
          echo "=== 系统架构 ==="
          uname -m
          uname -a

          echo ""
          echo "=== Java 环境 ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          which java || true
          java -version 2>&1 || true

          echo ""
          echo "=== SDK build-tools 中的 aapt2 ==="
          for f in $ANDROID_HOME/build-tools/*/aapt2; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              ls -la "$f"
              "$f" version 2>&1 | head -2 || echo "→ 这个 aapt2 无法执行"
            fi
          done

          echo ""
          echo "=== 给所有 aapt2 补上执行权限 ==="
          find $ANDROID_HOME -name "aapt2" -type f -exec chmod +x {} \; 2>/dev/null || true
          find ~/.gradle -name "aapt2" -type f -exec chmod +x {} \; 2>/dev/null || true
          echo "完成"

          echo ""
          echo "=== 彻底清理 Gradle 缓存（含 aapt2、AGP、依赖），强制全新下载 ==="
          du -sh ~/.gradle 2>/dev/null || true
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          echo "清理完成"

          echo ""
          echo "=== 磁盘空间（清理后）==="
          df -h /

      - name: Fix Lime aapt2
        run: |
          echo "=== 关键：Lime 模板里的 aapt2 ==="
          echo "gradle.properties 里的 android.aapt2FromMavenOverride 指向它，"
          echo "Gradle 用的就是它，而不是 SDK 自带的。"
          echo ""

          LIME_AAPT2=".haxelib/lime/git/templates/bin/aapt2/linux64/aapt2"
          echo "路径: $LIME_AAPT2"
          if [ -f "$LIME_AAPT2" ]; then
            echo "状态: 文件存在"
            ls -la "$LIME_AAPT2"
            echo "版本测试:"
            "$LIME_AAPT2" version 2>&1 | head -2 || echo "→ 无法执行！"
          else
            echo "状态: 文件不存在 —— 这就是 Daemon 启动失败的原因"
          fi

          echo ""
          echo "=== 用 SDK 的 aapt2 替换它，确保可用 ==="
          SDK_AAPT2=$(ls -1 $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          echo "选用的 SDK aapt2: $SDK_AAPT2"
          if [ -n "$SDK_AAPT2" ]; then
            chmod +x "$SDK_AAPT2" 2>/dev/null || true
            mkdir -p "$(dirname "$LIME_AAPT2")"
            cp -f "$SDK_AAPT2" "$LIME_AAPT2"
            chmod +x "$LIME_AAPT2"
            echo "替换结果:"
            ls -la "$LIME_AAPT2"
            echo "版本测试:"
            "$LIME_AAPT2" version 2>&1 | head -2 || echo "→ 仍然无法执行"
          else
            echo "→ 没找到 SDK 的 aapt2"
          fi

          echo ""
          echo "=== 备用方案：若 aapt2 仍不可用，删掉 override 让 Gradle 自己下载 ==="
          if ! "$LIME_AAPT2" version >/dev/null 2>&1; then
            echo "→ aapt2 不可用，从模板中删除 override 行"
            LIME_GP=".haxelib/lime/git/templates/android/template/gradle.properties"
            if [ -f "$LIME_GP" ]; then
              sed -i '/aapt2FromMavenOverride/d' "$LIME_GP"
              echo "已删除。模板中剩余的 aapt2 相关行："
              grep -n "aapt2" "$LIME_GP" || echo "（无）"
            else
              echo "（没找到模板 gradle.properties）"
            fi
          else
            echo "→ aapt2 可正常执行，保留 override"
          fi

      - name: Building the game
        run: |
          set -o pipefail
          haxelib run lime build android -final -D ONLY_ARM64 2>&1 | tee /tmp/build.log

      - name: Show build errors
        if: failure()
        run: |
          {
            echo "## 构建错误摘要"
            echo ""
            echo "日志总行数: $(wc -l < /tmp/build.log)"
            echo ""
            echo "### 错误行"
            echo '```'
            grep -n -i -E "error:|error [A-Z]|BUILD FAILED|What went wrong|FAILURE:|Exception|failed|not found|cannot|No such file" /tmp/build.log | tail -60 || echo "（没有匹配到关键字）"
            echo '```'
            echo "### 日志末尾 80 行"
            echo '```'
            tail -80 /tmp/build.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo "===== 错误行 ====="
          grep -n -i -E "error:|error [A-Z]|BUILD FAILED|What went wrong|FAILURE:|Exception|failed|not found|cannot|No such file" /tmp/build.log | tail -60 || true
          echo ""
          echo "===== 日志末尾 80 行 ====="
          tail -80 /tmp/build.log || true
          echo ""
          echo "===== 失败后的环境状态 ====="
          echo "--- 磁盘空间 ---"
          df -h /
          echo "--- 系统架构 ---"
          uname -m
          echo "--- SDK 里的 aapt2 ---"
          find $ANDROID_HOME -name "aapt2" -type f 2>/dev/null | head -5 || echo "（SDK 里没有 aapt2）"
          echo "--- Gradle 缓存里的 aapt2 ---"
          find ~/.gradle -name "aapt2" -type f 2>/dev/null | head -5 || echo "（Gradle 缓存里没有 aapt2）"
          echo "--- 实际的 gradle.properties ---"
          cat export/release/android/bin/gradle.properties 2>/dev/null || echo "（没有找到）"
          echo "--- 构建目录体积 ---"
          du -sh export 2>/dev/null || true
          du -sh ~/.gradle 2>/dev/null || true

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/*
      - name: Clear Previous Cache
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Upload New Cache
        if: always()
        uses: actions/cache@v4
        with:
          # 即使构建失败也保存，这样下次不用从头编译 25 分钟
          key: cache-build-android
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            C:/hostedtoolcache/windows/haxe/4.3.6/x64/lib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
            export/release/ios/${{ env.PROJECT_NAME }}/haxe/
            export/release/ios/${{ env.PROJECT_NAME }}/obj/
            export\release\windows\haxe\
            export\release\windows\obj\
            .haxelib\
          restore-keys: |
            cache-build-android